name: Test

on:
  push:
    branches:
      - '**'
    tags-ignore:
      - 'v*'
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Cargo Test Workspace
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies (LLVM, lld, Polly)
        run: |
          sudo apt-get update
          sudo apt-get install -y llvm lld 'libpolly-*-dev' || true

          for llvm_dir in $(find /usr/lib/llvm-*/bin -maxdepth 0 2>/dev/null | sort -V -r); do
            if [ -d "$llvm_dir" ]; then
              echo "$llvm_dir" >> "$GITHUB_PATH"
              sudo ln -sf "$llvm_dir"/* /usr/local/bin/ 2>/dev/null || true
              break
            fi
          done

          for tool in ld.lld llvm-ar llvm-strip; do
            if ! command -v "$tool" >/dev/null 2>&1; then
              for cand in $(which "${tool}-20" "${tool}-19" "${tool}-18" "${tool}-17" "${tool}-16" 2>/dev/null); do
                if [ -x "$cand" ]; then
                  sudo ln -sf "$cand" "/usr/local/bin/$tool"
                  break
                fi
              done
            fi
          done

          for cfg in $(which llvm-config llvm-config-18 llvm-config-19 llvm-config-17 llvm-config-16 2>/dev/null); do
            dir=$($cfg --libdir 2>/dev/null || true)
            if [ -n "$dir" ] && [ -d "$dir" ]; then
              touch /tmp/dummy.o
              ar rcs /tmp/libPolly.a /tmp/dummy.o
              sudo cp -n /tmp/libPolly.a "$dir/libPolly.a" 2>/dev/null || true
              sudo cp -n /tmp/libPolly.a "$dir/libPollyISL.a" 2>/dev/null || true
            fi
          done

          for libdir in $(find /usr/lib* -name "libLLVM*.so*" -exec dirname {} \; 2>/dev/null | sort -u); do
            touch /tmp/dummy.o
            ar rcs /tmp/libPolly.a /tmp/dummy.o
            sudo cp -n /tmp/libPolly.a "$libdir/libPolly.a" 2>/dev/null || true
            sudo cp -n /tmp/libPolly.a "$libdir/libPollyISL.a" 2>/dev/null || true
          done

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Run cargo test for workspace
        run: cargo test --workspace
