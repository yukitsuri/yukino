name: Test

on:
  push:
    branches:
      - '**'
    tags-ignore:
      - 'v*'
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Cargo Test Workspace
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies (LLVM, lld, Polly)
        run: |
          sudo apt-get update
          sudo apt-get install -y lld 'libpolly-*-dev' || true

          if ! command -v ld.lld >/dev/null 2>&1; then
            for candidate in $(which ld.lld-20 ld.lld-19 ld.lld-18 ld.lld-17 ld.lld-16 2>/dev/null) $(find /usr/lib/llvm-*/bin/ld.lld 2>/dev/null); do
              if [ -x "$candidate" ]; then
                sudo ln -sf "$candidate" /usr/local/bin/ld.lld
                break
              fi
            done
          fi

          for cfg in $(which llvm-config llvm-config-18 llvm-config-19 llvm-config-17 llvm-config-16 2>/dev/null); do
            dir=$($cfg --libdir 2>/dev/null || true)
            if [ -n "$dir" ] && [ -d "$dir" ]; then
              touch /tmp/dummy.o
              ar rcs /tmp/libPolly.a /tmp/dummy.o
              sudo cp -n /tmp/libPolly.a "$dir/libPolly.a" 2>/dev/null || true
              sudo cp -n /tmp/libPolly.a "$dir/libPollyISL.a" 2>/dev/null || true
            fi
          done

          for libdir in $(find /usr/lib* -name "libLLVM*.so*" -exec dirname {} \; 2>/dev/null | sort -u); do
            touch /tmp/dummy.o
            ar rcs /tmp/libPolly.a /tmp/dummy.o
            sudo cp -n /tmp/libPolly.a "$libdir/libPolly.a" 2>/dev/null || true
            sudo cp -n /tmp/libPolly.a "$libdir/libPollyISL.a" 2>/dev/null || true
          done

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Run cargo test for workspace
        run: cargo test --workspace
