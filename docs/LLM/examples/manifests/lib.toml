# Library Manifest (static archive, dynamic .so/.dll, or procedural compiler macro)
[lib]
name = "my_lib"
version = "0.1.0"
source = "my_lib/lib.ykn"
output = "static" # "static", "shared", or "macro"
includes = ["core", "stdlib"]

[libs.runtime]
# Library runtime dependencies

[config.debug]
opt = 0
debug_info = true

[config.release]
opt = 3
lto = true
