[lib]
name = "std"
version = "0.1.0"
entry = "std/lib.ykn"
yukino = ["0.1.0", "+"]
output = "static"
includes = []

[features]
default = []

[libs.static]
archives = ["libyukistd_core.a"]
system = []

[customcgus]
cgu_io = ["std/io", "std/platformio", "std/outf"]
cgu_fs = ["std/fs"]
cgu_strings = ["std/strings", "std/numf", "std/encore"]
cgu_math = ["std/math", "std/random"]
cgu_datetime = ["std/datetime"]
cgu_collections = ["std/collections"]
cgu_os = ["std/os", "std/env", "std/process", "std/sysinfo", "std/sysinfox"]
cgu_threads = ["std/threads", "std/sync", "std/sharedc"]
cgu_locale = ["std/locale"]
cgu_json = ["std/json", "std/jsonc", "std/json_parser", "std/json_serialize"]
cgu_url = ["std/url", "std/simpleurl"]
cgu_tools = ["std/itermtool", "std/line", "std/stdotool"]
cgu_compress = ["std/compress"]
cgu_crypto = ["std/crypto", "std/hash"]
cgu_net = ["std/net"]
cgu_regex = ["std/regex"]
cgu_toml = ["std/toml", "std/toml_parser", "std/toml_serialize"]
cgu_yaml = ["std/yaml", "std/yaml_parser", "std/yaml_serialize"]
cgu_sqlite = ["std/sqlite", "std/sqlite_engine"]
